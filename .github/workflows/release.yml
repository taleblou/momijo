name: Candidate Release Artifact (manual review required)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enforce allowed source and documentation formats
        run: |
          set -eu
          unexpected=$(find . -type f ! -path './.git/*' \
            ! \( -name '*.mojo' -o -name '*.md' -o -name '*.toml' \
              -o -name '*.yaml' -o -name '*.yml' -o -name '*.lock' \
              -o -name '*.cff' -o -name '*.png' -o -name '*.jpg' \
              -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' \
              -o -name '*.gif' -o -name '*.ico' -o -name '*.pdf' \
              -o -name '.editorconfig' -o -name '.gitattributes' \
              -o -name '.gitignore' -o -name 'LICENSE' -o -name 'CODEOWNERS' \) -print)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected repository files (review source-language policy):\n%s\n' "$unexpected" >&2
            exit 1
          fi
          symlinks=$(find . -type l ! -path './.git/*' -print)
          if [ -n "$symlinks" ]; then
            printf 'Symlinks are not permitted in this repository:\n%s\n' "$symlinks" >&2
            exit 1
          fi
      - name: Reject reserved-domain light forks
        run: |
          set -eu
          for domain in dataframe learn vision visual; do
            forbidden=$(find src/momijo tests examples benchmarks docs -name "${domain}_light*" -print)
            if [ -n "$forbidden" ]; then
              echo "Forbidden light variant of $domain" >&2
              exit 1
            fi
          done
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true
      - name: Require both engine smoke tests
        run: pixi run test-smoke
      - name: Require complete Mojo regression suite before a candidate artifact
        run: pixi run test-all
      - name: Precompile one compiler-matched namespace artifact
        run: pixi run package
      - name: Generate independently verifiable source and artifact SHA-256 manifests
        run: |
          set -euo pipefail
          test -s dist/momijo.mojoc
          find src/momijo -type f -name '*.mojo' -print0 | sort -z | xargs -0 -r sha256sum > dist/SOURCE-SHA256SUMS
          test -s dist/SOURCE-SHA256SUMS
          sha256sum dist/momijo.mojoc > dist/ARTIFACT-SHA256SUMS
          sha256sum -c dist/SOURCE-SHA256SUMS
          sha256sum -c dist/ARTIFACT-SHA256SUMS
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          pixi run mojo --version > dist/TOOLCHAIN.txt
      - name: Upload for explicit maintainer verification (no publication)
        uses: actions/upload-artifact@v7
        with:
          name: momijo-compiler-matched-candidate
          path: |
            dist/momijo.mojoc
            dist/ARTIFACT-SHA256SUMS
            dist/SOURCE-SHA256SUMS
            dist/SOURCE-COMMIT.txt
            dist/TOOLCHAIN.txt
            LICENSE
          if-no-files-found: error
